<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana Pro - AI 在线试衣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-5xl mx-auto py-12 px-4">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-black text-gray-900 mb-4">🍌 Nano Banana Virtual Try-On</h1>
            <p class="text-gray-600">提供一件衣服和一张模特照，AI 自动完成穿搭</p>
        </header>

        <!-- 设置区 -->
        <div class="bg-white rounded-3xl shadow-sm border p-6 mb-8 flex flex-wrap items-center gap-4">
            <div class="flex-1 min-w-[300px]">
                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Gemini API Key</label>
                <input type="password" id="apiKey" class="w-full bg-gray-50 border-none rounded-xl p-3 focus:ring-2 focus:ring-yellow-400" placeholder="粘贴你的 API Key">
            </div>
            <div class="flex-none">
                <span class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">模式：高保真换装 (Gemini 2.0)</span>
            </div>
        </div>

        <!-- 上传区 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
            <!-- 1. 衣服 -->
            <div class="bg-white p-6 rounded-3xl border shadow-sm">
                <div class="flex items-center mb-4">
                    <div class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center font-bold mr-3">1</div>
                    <h2 class="font-bold text-lg">上传目标衣服</h2>
                </div>
                <div id="drop-zone-1" class="border-2 border-dashed border-gray-200 rounded-2xl p-4 text-center hover:bg-yellow-50 transition-colors cursor-pointer relative h-80 flex flex-col justify-center items-center">
                    <input type="file" id="clothImg" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div id="previewCloth" class="hidden absolute inset-0 p-2">
                        <img class="w-full h-full object-contain rounded-xl">
                    </div>
                    <div class="text-gray-400">
                        <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"/></svg>
                        <p>点击或拖入衣服图片</p>
                        <p class="text-xs mt-1">白底图效果最佳</p>
                    </div>
                </div>
            </div>

            <!-- 2. 模特 -->
            <div class="bg-white p-6 rounded-3xl border shadow-sm">
                <div class="flex items-center mb-4">
                    <div class="w-8 h-8 bg-blue-400 rounded-full flex items-center justify-center font-bold text-white mr-3">2</div>
                    <h2 class="font-bold text-lg">上传模特人像</h2>
                </div>
                <div id="drop-zone-2" class="border-2 border-dashed border-gray-200 rounded-2xl p-4 text-center hover:bg-blue-50 transition-colors cursor-pointer relative h-80 flex flex-col justify-center items-center">
                    <input type="file" id="personImg" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div id="previewPerson" class="hidden absolute inset-0 p-2">
                        <img class="w-full h-full object-contain rounded-xl">
                    </div>
                    <div class="text-gray-400">
                        <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"/></svg>
                        <p>点击或拖入模特照片</p>
                        <p class="text-xs mt-1">尽量选择姿态清晰的照片</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 执行 -->
        <button id="generateBtn" class="w-full py-5 bg-black text-white rounded-2xl font-bold text-xl hover:bg-gray-800 transition-all shadow-xl disabled:bg-gray-400">
            开始融合并试穿
        </button>

        <!-- 结果 -->
        <div id="resultArea" class="mt-12 hidden">
            <h2 class="text-2xl font-bold text-center mb-8">✨ 试穿结果</h2>
            <div id="loading" class="flex flex-col items-center py-12">
                <div class="w-16 h-16 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-gray-500 font-medium">AI 正在计算衣服褶皱与光影...</p>
            </div>
            <div id="outputContainer" class="hidden bg-white p-4 rounded-3xl shadow-2xl border max-w-lg mx-auto">
                <img id="outputImg" class="w-full rounded-2xl">
                <div class="mt-4 flex gap-2">
                   <a id="downloadLink" download="try-on-result.png" class="flex-1 bg-yellow-400 text-center py-3 rounded-xl font-bold hover:bg-yellow-500">保存图片</a>
                   <button onclick="window.location.reload()" class="px-6 py-3 bg-gray-100 rounded-xl font-bold">重置</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // 辅助：文件转Base64
        const toBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                inlineData: { data: reader.result.split(',')[1], mimeType: file.type }
            });
            reader.onerror = reject;
        });

        // 预览逻辑
        const bindPreview = (inputId, previewId) => {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const preview = document.getElementById(previewId);
                    preview.querySelector('img').src = URL.createObjectURL(file);
                    preview.classList.remove('hidden');
                }
            });
        };
        bindPreview('clothImg', 'previewCloth');
        bindPreview('personImg', 'previewPerson');

        // 主逻辑
        document.getElementById('generateBtn').onclick = async () => {
            const key = document.getElementById('apiKey').value;
            const clothFile = document.getElementById('clothImg').files[0];
            const personFile = document.getElementById('personImg').files[0];

            if (!key || !clothFile || !personFile) {
                alert("请填入 API Key 并上传两张图片！");
                return;
            }

            const btn = document.getElementById('generateBtn');
            const resultArea = document.getElementById('resultArea');
            const loading = document.getElementById('loading');
            const outputContainer = document.getElementById('outputContainer');
            
            btn.disabled = true;
            resultArea.classList.remove('hidden');
            loading.classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                const genAI = new GoogleGenerativeAI(key);
                // 使用 Gemini 2.0 Flash 实验版，它对图像编辑支持最好
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash-exp" });

                const clothData = await toBase64(clothFile);
                const personData = await toBase64(personFile);

                // 核心 Prompt：明确指定图片 1 是衣服，图片 2 是模特
                const prompt = `
                    Task: Virtual Try-On.
                    Image 1: A garment (target clothing).
                    Image 2: A model (person).
                    Instructions: 
                    1. Extract the clothing item from Image 1.
                    2. Put this specific clothing item onto the person in Image 2.
                    3. Ensure the person's pose, face, body shape, and background remain exactly the same.
                    4. The clothing must fit naturally, following the body contours, folds, and lighting of the model.
                    5. Output only the final generated image of the person wearing the new clothes.
                `;

                const result = await model.generateContent([prompt, clothData, personData]);
                const response = await result.response;
                
                // 寻找返回结果中的图片部分
                const imagePart = response.candidates[0].content.parts.find(p => p.inlineData);
                
                if (imagePart) {
                    const base64Data = `data:${imagePart.inlineData.mimeType};base64,${imagePart.inlineData.data}`;
                    document.getElementById('outputImg').src = base64Data;
                    document.getElementById('downloadLink').href = base64Data;
                    loading.classList.add('hidden');
                    outputContainer.classList.remove('hidden');
                    // 滚动到结果区
                    outputContainer.scrollIntoView({ behavior: 'smooth' });
                } else {
                    // 兜底方案：如果模型只返回了文字描述
                    throw new Error("模型仅返回了描述文字，未能生成图像。请确保您的 API Key 拥有 Gemini 2.0 图像生成权限（通常需要 Image Modality 开启）。");
                }

            } catch (err) {
                console.error(err);
                alert("生成失败：" + err.message);
                resultArea.classList.add('hidden');
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
